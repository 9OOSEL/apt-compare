name: update-apt-data
on:
  schedule:
    - cron: "0 20 * * *"   # 매일 한국시간 새벽 5시
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_apt_data.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apt-data.json cache
          git commit -m "update data" || echo "no changes"
          git push
